services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      MODEL_ID: ${MODEL_ID:-google/medgemma-1.5-4b-it}
      LOCAL_MODEL_PATH: ${LOCAL_MODEL_PATH:-/models/medgemma-1.5-4b-it}
      MOCK_MODEL: ${MOCK_MODEL:-false}
      UPLOAD_DIR: /app/uploads
      DATABASE_URL: postgresql+psycopg://medgemma:medgemma@postgres:5432/medgemma
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      PHASE1_MAX_NEW_TOKENS: ${PHASE1_MAX_NEW_TOKENS:-900}
      FINAL_MAX_NEW_TOKENS: ${FINAL_MAX_NEW_TOKENS:-1600}
      HF_HOME: /root/.cache/huggingface
    volumes:
      - uploads:/app/uploads
      - huggingface_cache:/root/.cache/huggingface
      - ${LOCAL_MODEL_HOST_PATH:-../medgemma-1.5-4b-it}:/models/medgemma-1.5-4b-it:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medgemma
      POSTGRES_USER: medgemma
      POSTGRES_PASSWORD: medgemma
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medgemma -d medgemma"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  uploads:
  huggingface_cache:
  postgres_data:
